version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify Next.js SSR: Console env vars are available at build time,
        # not automatically in the compute runtime. Write them to
        # `.env.production` before `next build` so Next.js can load them.
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        # The helper logs variable names only — never values — and does not
        # commit `.env.production`.
        - node scripts/write-amplify-env.mjs
        - npm run build
        # Keep a copy inside the compute artifact in case cwd is `.next`.
        - if [ -f .env.production ]; then cp .env.production .next/.env.production; fi
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
